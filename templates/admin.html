<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZenilPro Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #2563EB; --blue2: #1D4ED8; --white: #fff; --gray: #F3F4F6;
            --dark: #1F2937; --red: #EF4444; --green: #10B981; --orange: #F59E0B;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:var(--gray); min-height:100vh; }
        
        /* LOGIN */
        .login-wrap { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
        .login-box { background:var(--white); padding:30px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.1); width:100%; max-width:380px; text-align:center; }
        .login-box .icon { font-size:40px; color:var(--blue); margin-bottom:12px; }
        .login-box h1 { font-size:22px; margin-bottom:4px; }
        .login-box p { color:#6B7280; margin-bottom:20px; font-size:14px; }
        .login-box input { width:100%; padding:12px; border:2px solid #E5E7EB; border-radius:10px; font-size:15px; margin-bottom:12px; outline:none; }
        .login-box input:focus { border-color:var(--blue); }
        .login-box button { width:100%; padding:14px; background:var(--blue); color:var(--white); border:none; border-radius:10px; font-size:16px; font-weight:600; cursor:pointer; }
        .login-box a { display:block; margin-top:12px; color:#6B7280; text-decoration:none; font-size:14px; }
        
        /* DASH */
        .dash { display:none; }
        .topbar { background:var(--dark); color:var(--white); padding:12px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
        .topbar h3 { font-size:15px; }
        .topbar .menu-btn { background:none; border:none; color:var(--white); font-size:22px; cursor:pointer; display:none; }
        .topbar-actions { display:flex; gap:8px; align-items:center; }
        .btn-logout { padding:7px 12px; background:rgba(239,68,68,.2); color:var(--red); border:none; border-radius:8px; cursor:pointer; font-size:12px; }
        
        .main-layout { display:flex; min-height:calc(100vh - 52px); }
        .overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.5); z-index:99; }
        
        /* SIDEBAR */
        .sidebar { width:230px; background:var(--white); border-right:1px solid #E5E7EB; padding:12px; position:sticky; top:52px; height:calc(100vh - 52px); overflow-y:auto; }
        .sidebar button { display:flex; align-items:center; gap:8px; width:100%; padding:11px 12px; border:none; background:none; border-radius:10px; cursor:pointer; font-size:13px; font-weight:500; color:#374151; margin-bottom:3px; text-align:left; }
        .sidebar button:hover { background:var(--gray); }
        .sidebar button.active { background:var(--blue); color:var(--white); }
        .sidebar button i { width:18px; text-align:center; }
        
        /* CONTENT */
        .content { flex:1; padding:16px; overflow-y:auto; }
        
        /* CARDS */
        .card { background:var(--white); border-radius:12px; padding:16px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
        .card h3 { margin-bottom:12px; font-size:15px; display:flex; align-items:center; gap:8px; }
        
        /* STATS */
        .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:16px; }
        .stat { background:var(--white); padding:16px; border-radius:12px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.05); }
        .stat .num { font-size:26px; font-weight:700; color:var(--blue); }
        .stat .label { font-size:11px; color:#6B7280; margin-top:4px; }
        
        /* TABLE */
        .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
        table { width:100%; border-collapse:collapse; min-width:700px; }
        th, td { padding:10px 12px; text-align:left; border-bottom:1px solid #E5E7EB; font-size:13px; }
        th { background:#F9FAFB; font-weight:600; color:#6B7280; font-size:11px; text-transform:uppercase; white-space:nowrap; }
        td img { width:45px; height:45px; border-radius:8px; object-fit:cover; }
        
        /* FORM */
        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .form-group label { display:block; font-size:12px; font-weight:500; color:#374151; margin-bottom:4px; }
        .form-group input, .form-group select, .form-group textarea { width:100%; padding:10px; border:2px solid #E5E7EB; border-radius:8px; font-size:13px; font-family:inherit; outline:none; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--blue); }
        .full { grid-column:1/-1; }
        
        /* FILE */
        .file-box { border:2px dashed #E5E7EB; border-radius:12px; padding:20px; text-align:center; cursor:pointer; transition:all .2s; }
        .file-box:hover { border-color:var(--blue); background:#F0F5FF; }
        .file-box i { font-size:32px; color:var(--blue); }
        .file-box p { color:#6B7280; font-size:12px; margin-top:4px; }
        .file-box img { max-width:150px; max-height:150px; margin-top:8px; border-radius:8px; }
        .file-box input { display:none; }
        
        /* BUTTONS */
        .btn { padding:7px 14px; border:none; border-radius:8px; cursor:pointer; font-weight:500; font-size:12px; display:inline-flex; align-items:center; gap:5px; }
        .btn-blue { background:var(--blue); color:var(--white); }
        .btn-red { background:var(--red); color:var(--white); }
        .btn-green { background:var(--green); color:var(--white); }
        .btn-orange { background:var(--orange); color:var(--white); }
        .btn-sm { padding:5px 10px; font-size:11px; }
        
        /* BADGES */
        .badge { padding:3px 8px; border-radius:50px; font-size:11px; font-weight:600; }
        .badge-green { background:#D1FAE5; color:var(--green); }
        .badge-yellow { background:#FEF3C7; color:var(--orange); }
        .badge-red { background:#FEE2E2; color:var(--red); }
        .badge-blue { background:#DBEAFE; color:var(--blue); }
        
        /* MODAL */
        .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.5); z-index:999; align-items:center; justify-content:center; }
        .modal-overlay.show { display:flex; }
        .modal { background:var(--white); padding:24px; border-radius:16px; width:90%; max-width:500px; max-height:90vh; overflow-y:auto; position:relative; }
        .modal .close { position:absolute; top:12px; right:16px; font-size:22px; cursor:pointer; background:none; border:none; color:#6B7280; }
        .modal h3 { margin-bottom:16px; font-size:18px; }
        
        /* ORDER CARD */
        .order-card { background:var(--white); border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.05); }
        .order-card .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex-wrap:wrap; gap:4px; }
        .order-id { font-weight:700; color:var(--blue); }
        
        /* TAG */
        .tag { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; background:var(--gray); border-radius:50px; font-size:12px; margin:2px; }
        .tag button { background:none; border:none; cursor:pointer; color:var(--red); font-size:14px; padding:0; margin-left:2px; }
        
        /* MOBILE */
        @media (max-width:768px) {
            .topbar .menu-btn { display:block; }
            .sidebar { position:fixed; left:-260px; top:0; height:100vh; z-index:200; transition:left 0.3s; width:260px; padding-top:60px; }
            .sidebar.open { left:0; }
            .overlay.show { display:block; }
            .content { width:100%; }
            .form-grid { grid-template-columns:1fr; }
            .stats { grid-template-columns:1fr 1fr; }
            table { font-size:11px; }
            th, td { padding:8px 6px; }
        }
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="login-wrap">
    <div class="login-box">
        <div class="icon"><i class="fa-solid fa-spray-can-sparkles"></i></div>
        <h1>ZenilPro Admin</h1>
        <p>Boshqaruv paneli</p>
        <input type="password" id="passInput" placeholder="Parolni kiriting" onkeydown="if(event.key==='Enter')doLogin()">
        <button onclick="doLogin()"><i class="fa-solid fa-right-to-bracket"></i> Kirish</button>
        <a href="/">← Do'konga qaytish</a>
    </div>
</div>

<!-- DASHBOARD -->
<div id="dashPage" class="dash">
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>
    
    <!-- EDIT MODAL -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <button class="close" onclick="closeEditModal()">&times;</button>
            <h3 id="editTitle">✏️ Mahsulotni tahrirlash</h3>
            <form onsubmit="saveEdit(event)" style="margin-top:12px;">
                <input type="hidden" id="editId">
                <div class="form-grid">
                    <div class="form-group"><label>Nomi</label><input id="editName" required></div>
                    <div class="form-group"><label>Kategoriya</label><select id="editCat">
                        <option value="parfum">Parfyumeriya</option>
                        <option value="cosmetics">Kosmetika</option>
                        <option value="dishes">Idish-tovoq</option>
                        <option value="clothes">Kiyim</option>
                        <option value="powders">Kukunlar</option>
                    </select></div>
                    <div class="form-group"><label>Narx</label><input type="number" id="editPrice" required></div>
                    <div class="form-group"><label>Eski narx</label><input type="number" id="editOldPrice"></div>
                    <div class="form-group"><label>Soni</label><input type="number" id="editStock"></div>
                    <div class="form-group"><label>Chegirma %</label><input type="number" id="editDisc"></div>
                    <div class="form-group full"><label>Rasm URL</label><input id="editImg"></div>
                    <div class="form-group full"><label>Tavsif</label><textarea id="editDesc" rows="2"></textarea></div>
                </div>
                <button type="submit" class="btn btn-blue" style="margin-top:12px;padding:10px 20px;">💾 Saqlash</button>
            </form>
        </div>
    </div>
    
    <!-- TOPBAR -->
    <div class="topbar">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <h3>🛍 ZenilPro Admin</h3>
        <div class="topbar-actions">
            <a href="/" style="color:#D1D5DB;text-decoration:none;font-size:12px;">Do'kon</a>
            <button class="btn-logout" onclick="doLogout()">🚪 Chiqish</button>
        </div>
    </div>
    
    <div class="main-layout">
        <!-- SIDEBAR -->
        <div class="sidebar" id="sidebar">
            <button class="active" onclick="showTab('products')"><i class="fa-solid fa-box"></i> Mahsulotlar</button>
            <button onclick="showTab('add')"><i class="fa-solid fa-plus-circle"></i> Qo'shish</button>
            <button onclick="showTab('orders')"><i class="fa-solid fa-receipt"></i> Buyurtmalar</button>
            <button onclick="showTab('categories')"><i class="fa-solid fa-tags"></i> Kategoriyalar</button>
        </div>
        
        <!-- CONTENT -->
        <div class="content" id="tabContent"></div>
    </div>
</div>

<script>
// GLOBALS
let allProducts = [];
let allCategories = ['parfum','cosmetics','dishes','clothes','powders'];
let catNames = {parfum:'Parfyumeriya',cosmetics:'Kosmetika',dishes:'Idish-tovoq',clothes:'Kiyim',powders:'Kukunlar'};
let uploadedImage = '';

// INIT
fetch('/api/admin/check').then(r=>r.json()).then(d=>{ if(d.is_admin){ showDash(); loadTab('products'); } });

function doLogin(){
    fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('passInput').value})})
    .then(r=>r.json()).then(d=>{ if(d.success){ showDash(); loadTab('products'); } else alert('Noto\'g\'ri parol!'); });
}
function doLogout(){ fetch('/api/admin/logout',{method:'POST'}).then(()=>location.reload()); }
function showDash(){ document.getElementById('loginPage').style.display='none'; document.getElementById('dashPage').style.display='block'; }
function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); }

function showTab(t){
    closeSidebar();
    document.querySelectorAll('.sidebar button').forEach(b=>b.classList.remove('active'));
    event.target.classList.add('active');
    loadTab(t);
}

function loadTab(t){
    if(t==='products') loadProducts();
    else if(t==='add') showAddForm();
    else if(t==='orders') loadOrders();
    else if(t==='categories') loadCategories();
}

// ==================== PRODUCTS ====================
function loadProducts(){
    fetch('/api/products').then(r=>r.json()).then(d=>{
        if(d.success){
            allProducts = d.products;
            let cats = [...new Set(allProducts.map(p=>p.category))];
            let html = `<div class="stats">
                <div class="stat"><div class="num">${allProducts.length}</div><div class="label">Jami mahsulot</div></div>
                <div class="stat"><div class="num">${cats.length}</div><div class="label">Kategoriya</div></div>
                <div class="stat"><div class="num">${allProducts.reduce((s,p)=>s+p.in_stock,0)}</div><div class="label">Jami qoldiq</div></div>
            </div>
            <div class="card">
                <h3>📦 Mahsulotlar (${allProducts.length})</h3>
                <div class="table-wrap"><table>
                    <thead><tr><th>Rasm</th><th>Nomi</th><th>Kat.</th><th>Narx</th><th>Qoldiq</th><th>Amallar</th></tr></thead>
                    <tbody>`;
            allProducts.forEach(p=>{
                html += `<tr>
                    <td><img src="${p.image}" onerror="this.src='https://placehold.co/45'"></td>
                    <td><strong>${p.name}</strong><br><small style="color:#9CA3AF;">${(p.description||'').substring(0,40)}...</small></td>
                    <td>${catNames[p.category]||p.category}</td>
                    <td><strong style="color:var(--blue)">${(p.price+'').replace(/\B(?=(\d{3})+(?!\d))/g,' ')}</strong></td>
                    <td><span class="badge ${p.in_stock>10?'badge-green':p.in_stock>5?'badge-yellow':'badge-red'}">${p.in_stock}</span></td>
                    <td style="white-space:nowrap;">
                        <button class="btn btn-blue btn-sm" onclick="editProduct('${p.id}')" title="Tahrirlash">✏️</button>
                        <button class="btn btn-red btn-sm" onclick="delProd('${p.id}')" title="O'chirish">🗑</button>
                    </td>
                </tr>`;
            });
            html += '</tbody></table></div></div>';
            document.getElementById('tabContent').innerHTML = html;
        }
    });
}

function editProduct(id){
    const p = allProducts.find(x=>x.id===id);
    if(!p) return;
    document.getElementById('editId').value = p.id;
    document.getElementById('editName').value = p.name;
    document.getElementById('editCat').value = p.category;
    document.getElementById('editPrice').value = p.price;
    document.getElementById('editOldPrice').value = p.old_price||'';
    document.getElementById('editStock').value = p.in_stock;
    document.getElementById('editDisc').value = p.discount||0;
    document.getElementById('editImg').value = p.image;
    document.getElementById('editDesc').value = p.description||'';
    document.getElementById('editModal').classList.add('show');
}

function closeEditModal(){ document.getElementById('editModal').classList.remove('show'); }

function saveEdit(e){
    e.preventDefault();
    let data = {
        id: document.getElementById('editId').value,
        name: document.getElementById('editName').value,
        category: document.getElementById('editCat').value,
        price: parseInt(document.getElementById('editPrice').value),
        old_price: parseInt(document.getElementById('editOldPrice').value) || parseInt(document.getElementById('editPrice').value),
        in_stock: parseInt(document.getElementById('editStock').value)||0,
        discount: parseInt(document.getElementById('editDisc').value)||0,
        image: document.getElementById('editImg').value,
        description: document.getElementById('editDesc').value
    };
    
    // PUT request orqali yangilash
    fetch('/api/admin/products/update', {
        method:'PUT',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(data)
    }).then(r=>r.json()).then(d=>{
        if(d.success){ alert('✅ Yangilandi!'); closeEditModal(); loadProducts(); }
        else alert('❌ Xatolik!');
    });
}

function delProd(id){
    if(!confirm('O\'chirilsinmi?')) return;
    fetch('/api/admin/products',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})})
    .then(r=>r.json()).then(d=>{ if(d.success){ alert('O\'chirildi!'); loadProducts(); } });
}

// ==================== ADD ====================
function showAddForm(){
    uploadedImage = '';
    document.getElementById('tabContent').innerHTML = `
        <div class="card"><h3>➕ Yangi Mahsulot Qo'shish</h3>
        <form onsubmit="addProd(event)" style="margin-top:12px;">
            <div class="form-grid">
                <div class="form-group full">
                    <label>📸 Rasm</label>
                    <div class="file-box" onclick="document.getElementById('fileInput').click()">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <p>Rasm yuklash (png, jpg)</p>
                        <img id="previewImg" style="display:none;">
                        <input type="file" id="fileInput" accept="image/*" onchange="uploadFile(this)">
                    </div>
                    <div id="uploadStatus" style="margin-top:6px;font-size:12px;display:none;"></div>
                </div>
                <div class="form-group"><label>Nomi *</label><input id="aname" required></div>
                <div class="form-group"><label>Kategoriya</label><select id="acat">${allCategories.map(c=>`<option value="${c}">${catNames[c]}</option>`).join('')}</select></div>
                <div class="form-group"><label>Narx *</label><input type="number" id="aprice" required></div>
                <div class="form-group"><label>Eski narx</label><input type="number" id="aoldprice"></div>
                <div class="form-group"><label>Soni</label><input type="number" id="astock" value="10"></div>
                <div class="form-group"><label>Chegirma %</label><input type="number" id="adisc" value="0"></div>
                <div class="form-group full"><label>Tavsif</label><textarea id="adesc" rows="2"></textarea></div>
            </div>
            <button type="submit" class="btn btn-blue" style="margin-top:12px;padding:12px 24px;">➕ Qo'shish</button>
        </form></div>`;
}

function uploadFile(input){
    if(!input.files[0]) return;
    let fd = new FormData(); fd.append('file', input.files[0]);
    let s = document.getElementById('uploadStatus');
    s.style.display='block'; s.textContent='⏳ Yuklanmoqda...'; s.style.color='#6B7280';
    fetch('/api/admin/upload',{method:'POST',body:fd})
    .then(r=>r.json()).then(d=>{
        if(d.success){
            uploadedImage=d.url;
            document.getElementById('previewImg').src=d.url;
            document.getElementById('previewImg').style.display='block';
            s.textContent='✅ Yuklandi!'; s.style.color='#10B981';
        } else { s.textContent='❌ '+d.message; s.style.color='#EF4444'; }
    }).catch(()=>{ s.textContent='❌ Xatolik'; s.style.color='#EF4444'; });
}

function addProd(e){
    e.preventDefault();
    let data = {
        name: document.getElementById('aname').value,
        category: document.getElementById('acat').value,
        price: document.getElementById('aprice').value,
        old_price: document.getElementById('aoldprice').value || document.getElementById('aprice').value,
        in_stock: document.getElementById('astock').value || 10,
        discount: document.getElementById('adisc').value || 0,
        image: uploadedImage || 'https://placehold.co/400',
        description: document.getElementById('adesc').value
    };
    if(!data.name||!data.price){ alert('Nomi va narx majburiy!'); return; }
    fetch('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
    .then(r=>r.json()).then(d=>{ if(d.success){ alert('✅ Qo\'shildi!'); loadTab('products'); } else alert('❌ Xatolik!'); });
}

// ==================== ORDERS ====================
function loadOrders(){
    fetch('/api/orders').then(r=>r.json()).then(d=>{
        if(d.success){
            let pend = d.orders.filter(o=>o.status==='pending').length;
            let done = d.orders.filter(o=>o.status==='delivered').length;
            let total = d.orders.reduce((s,o)=>s+o.total,0);
            let html = `<div class="stats">
                <div class="stat"><div class="num">${d.orders.length}</div><div class="label">Jami</div></div>
                <div class="stat"><div class="num" style="color:var(--orange);">${pend}</div><div class="label">Kutilmoqda</div></div>
                <div class="stat"><div class="num" style="color:var(--green);">${done}</div><div class="label">Bajarilgan</div></div>
                <div class="stat"><div class="num">${(total+'').replace(/\B(?=(\d{3})+(?!\d))/g,' ')}</div><div class="label">so'm</div></div>
            </div>
            <div class="card"><h3>📋 Buyurtmalar</h3>`;
            if(d.orders.length===0) html+='<p style="color:#6B7280;text-align:center;padding:30px;">Buyurtmalar yo\'q</p>';
            else d.orders.forEach(o=>{
                html += `<div class="order-card">
                    <div class="top"><span class="order-id">#${o.order_id}</span><span class="badge ${o.status==='pending'?'badge-yellow':o.status==='delivered'?'badge-green':'badge-blue'}">${o.status_text||o.status}</span></div>
                    <div><strong>${o.customer_name}</strong> | ${o.phone}</div>
                    <div style="color:#6B7280;font-size:12px;">${o.items?.map(i=>i.name+' ×'+i.quantity).join(', ')}</div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;">
                        <strong style="color:var(--blue);">${(o.total+'').replace(/\B(?=(\d{3})+(?!\d))/g,' ')} so'm</strong>
                        <small style="color:#9CA3AF;">${new Date(o.created_at).toLocaleDateString()}</small>
                    </div>`;
                if(o.status==='pending') html += `<select onchange="changeOrderStatus('${o.order_id}',this.value)" style="margin-top:8px;padding:6px;border-radius:6px;border:1px solid #E5E7EB;width:100%;font-size:12px;">
                    <option value="pending">Kutilmoqda</option>
                    <option value="confirmed">Tasdiqlangan</option>
                    <option value="delivered">Yetkazilgan</option>
                    <option value="cancelled">Bekor qilingan</option>
                </select>`;
                html += '</div>';
            });
            html += '</div>';
            document.getElementById('tabContent').innerHTML = html;
        }
    });
}

function changeOrderStatus(oid, status){
    fetch(`/api/admin/orders/${oid}/status`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})})
    .then(r=>r.json()).then(d=>{ if(d.success){ alert('Yangilandi!'); loadOrders(); } });
}

// ==================== CATEGORIES ====================
function loadCategories(){
    let html = `<div class="card"><h3>🏷️ Kategoriyalar</h3>
        <div style="margin-bottom:16px;">`;
    allCategories.forEach(c=>{
        html += `<span class="tag">${catNames[c]} <button onclick="deleteCategory('${c}')" title="O'chirish">&times;</button></span>`;
    });
    html += `</div>
        <h4 style="margin-bottom:8px;">➕ Yangi kategoriya</h4>
        <div style="display:flex;gap:8px;">
            <input id="newCatName" placeholder="Nomi" style="flex:1;padding:10px;border:2px solid #E5E7EB;border-radius:8px;font-size:13px;">
            <input id="newCatId" placeholder="ID (lotin)" style="flex:1;padding:10px;border:2px solid #E5E7EB;border-radius:8px;font-size:13px;">
            <button class="btn btn-blue" onclick="addCategory()">Qo'shish</button>
        </div>
        <p style="color:#6B7280;font-size:11px;margin-top:6px;">ID: lotin harflar, kichik. Masalan: "parfum"</p>
    </div>`;
    document.getElementById('tabContent').innerHTML = html;
}

function addCategory(){
    let name = document.getElementById('newCatName').value.trim();
    let id = document.getElementById('newCatId').value.trim().toLowerCase();
    if(!name||!id){ alert('Nomi va ID kerak!'); return; }
    if(allCategories.includes(id)){ alert('Bu ID mavjud!'); return; }
    allCategories.push(id);
    catNames[id] = name;
    alert('✅ Kategoriya qo\'shildi!');
    loadCategories();
}

function deleteCategory(id){
    if(!confirm(`"${catNames[id]}" kategoriyasini o'chirishni istaysizmi?`)) return;
    allCategories = allCategories.filter(c=>c!==id);
    delete catNames[id];
    alert('O\'chirildi!');
    loadCategories();
}
</script>
